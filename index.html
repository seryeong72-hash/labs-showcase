<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LABS Showcase - 캐릭터 프로토타입</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f6f6;--card:#fff;--ink:#222;--sub:#8a8a8a;--line:#ececec;--g:#5fd01f;--gl:#eefbe3;--top:#444;--dark:#46464b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#17181a;--card:#222326;--ink:#f1f1f1;--sub:#9a9a9a;--line:#333;--gl:#243319}}
:root[data-theme=dark]{--bg:#17181a;--card:#222326;--ink:#f1f1f1;--sub:#9a9a9a;--line:#333;--gl:#243319}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Pretendard,"Noto Sans KR","Apple SD Gothic Neo",sans-serif}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.top{background:var(--top);color:#fff;text-align:center;font-size:12px;padding:8px}
.shell{display:flex;min-height:calc(100vh - 34px)}
nav{width:72px;background:var(--card);border-right:1px solid var(--line);padding:14px 0;display:flex;flex-direction:column;gap:6px;align-items:center;flex-shrink:0}
nav button{width:56px;padding:8px 0;border-radius:12px;font-size:11px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button i{font-style:normal;font-size:18px}nav button.on{background:var(--bg);color:var(--ink);font-weight:700}
.sub{position:absolute;left:72px;top:34px;width:150px;background:var(--card);border:1px solid var(--line);border-radius:0 12px 12px 0;padding:10px;display:none;z-index:20;box-shadow:0 8px 20px #0001}
.sub.show{display:block}.sub button{display:block;width:100%;text-align:left;padding:7px 8px;border-radius:8px;font-size:13px}.sub button:hover{background:var(--bg)}
main{flex:1;min-width:0;padding:16px 24px 120px}
.search{max-width:520px;margin:0 auto 18px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 16px;color:var(--sub);font-size:13px}
.card{background:var(--card);border-radius:16px;padding:20px;border:1px solid var(--line)}
h2{font-size:16px;margin:0 0 12px}h1{font-size:22px;margin:0 0 14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
.empty{text-align:center;color:var(--sub);padding:26px 0;font-size:12px}
.btn{border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:12px}.btn.p{background:var(--g);color:#fff;border-color:var(--g);font-weight:700}
.hero{height:220px;border-radius:16px;background:linear-gradient(120deg,#200,#a10 60%,#400);color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}.tile{border-radius:12px;color:#fff;padding:14px;height:110px;font-weight:700;font-size:13px;display:flex;align-items:flex-end}
.wrap2{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
.me{text-align:center}.chip{background:var(--gl);color:#3a9a0a;border-radius:999px;padding:2px 10px;font-weight:700;font-size:12px}.chip b{background:var(--g);color:#fff;border-radius:6px;padding:0 5px;margin-left:4px;font-size:11px}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g);transition:width .6s}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);margin-top:16px;padding-top:14px;font-size:12px;color:var(--sub)}.stats b{display:block;font-size:22px;color:var(--ink)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:16px}.tabs button{padding:12px;font-size:13px;color:var(--sub)}.tabs button.on{background:var(--dark);color:#fff;font-weight:700}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;margin-bottom:6px}.row.mine{background:var(--gl);outline:2px solid var(--g)}
.rk{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;border:2px solid var(--line)}.rk.r1{border-color:#f6c945;color:#c99a00}.rk.r2{border-color:#bbb}.rk.r3{border-color:#f0a050}
.av{width:36px;height:36px;border-radius:50%;flex-shrink:0}.xp{margin-left:auto;background:var(--gl);color:#3a9a0a;font-weight:800;font-size:12px;border-radius:999px;padding:2px 10px}
.rise{animation:rise 1.2s ease}@keyframes rise{0%{transform:translateY(60px);opacity:.3}60%{transform:translateY(-12px);box-shadow:0 0 0 8px #5fd01f55}100%{transform:none}}
.mis{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}.mis.done{background:var(--gl)}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.bd{text-align:center;padding:16px 8px;border:1px solid var(--line);border-radius:12px;font-size:12px}.bd .ic{font-size:30px}.bd.off{opacity:.35;filter:grayscale(1)}
table{width:100%;border-collapse:collapse}td,th{padding:12px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}th{background:var(--bg)}
.modal{position:fixed;inset:0;background:#0007;display:none;place-items:center;z-index:50}.modal.show{display:grid}.mbox{background:var(--card);border-radius:20px;padding:22px;width:min(680px,94vw);max-height:90vh;overflow:auto;display:grid;grid-template-columns:200px 1fr;gap:20px}
.opt{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.opt h3{width:100%;margin:0;font-size:12px;color:var(--sub)}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid transparent;outline:1px solid var(--line)}.sw.on{border-color:var(--ink)}.pill{padding:5px 12px;border:1px solid var(--line);border-radius:999px;font-size:12px}.pill.on{background:var(--ink);color:var(--card)}.pill.lock{opacity:.4}
#walker{position:fixed;bottom:12px;left:100px;width:104px;z-index:30;transition:left 4.5s linear;cursor:pointer}
#walker svg{width:104px;height:auto;overflow:visible}
#bub{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-30%);width:230px;background:var(--card);border:2px solid var(--g);border-radius:16px;padding:10px 12px;font-size:12.5px;box-shadow:0 8px 24px #0002;cursor:default}
#bub:after{content:"";position:absolute;bottom:-9px;left:34%;width:14px;height:14px;background:var(--card);border-right:2px solid var(--g);border-bottom:2px solid var(--g);transform:rotate(45deg)}
#bub small{display:block;color:#3a9a0a;font-weight:700;margin-bottom:2px}#bub .go{margin-top:6px;color:#fff;background:var(--g);border-radius:8px;padding:3px 10px;font-size:12px;font-weight:700}
.flip #wc{transform:scaleX(-1)}.walk .leg1{animation:l1 .45s infinite alternate}.walk .leg2{animation:l1 .45s infinite alternate-reverse}.walk svg{animation:bob .45s infinite}
.leg1,.leg2{transform-box:fill-box;transform-origin:50% 0}svg.s0{animation:rock 2.4s ease-in-out infinite;transform-origin:50% 100%}.zz{animation:zz 2s infinite}@keyframes zz{50%{transform:translateY(-4px);opacity:.4}}@keyframes rock{50%{transform:rotate(2.5deg)}}.kick{transform-box:fill-box;transform-origin:100% 50%;animation:kk .9s infinite alternate}.kick2{transform-box:fill-box;transform-origin:0 50%;animation:kk .9s infinite alternate-reverse}@keyframes kk{to{transform:rotate(-10deg)}}.eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}.wave{transform-box:fill-box;transform-origin:0 100%;animation:wv .6s infinite alternate}@keyframes wv{to{transform:rotate(-22deg)}}@keyframes l1{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}@keyframes bob{50%{transform:translateY(-3px)}}
.cheer svg,.cheer svg.s0{animation:jump .5s 4}@keyframes jump{50%{transform:translateY(-18px)}}
.toast{position:fixed;top:50px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 18px;border-radius:999px;z-index:60;display:none;font-weight:700}
.note{background:var(--gl);border-radius:10px;padding:10px 14px;font-size:12px;margin-bottom:14px}
@media(max-width:820px){.wrap2,.grid3,.tiles,.mbox{grid-template-columns:1fr}nav{width:56px}main{padding:12px}.badges{grid-template-columns:repeat(2,1fr)}}
.walk svg.s0{animation:scoot .5s infinite}@keyframes scoot{50%{transform:translateY(-4px) rotate(3deg)}}.cheer.walk svg,.cheer.walk svg.s0{animation:jump .5s 4}.av svg{width:100%;height:100%;display:block}</style></head><body>
<div class="top">🎉 임팩티브AI 및 휴넷FLEX 가입(체험)을 축하합니다!</div>
<div class="shell">
<nav id="nav"></nav>
<div class="sub" id="sub"><button data-p="learn">학습현황</button><button data-p="mission">활동/미션</button><button data-p="coach">개인 코칭</button></div>
<main id="main"></main></div>
<div id="walker"><div id="bub"></div><div id="wc"></div></div>
<div class="modal" id="modal"><div class="mbox"><div id="mprev" style="text-align:center"></div><div id="mopt"></div></div></div>
<div class="toast" id="toast"></div>
<script>
// ===== 설정(운영 설정 기준과 연결되는 값) =====
const CFG={levels:[0,100,300,500,800,1200,1800],stage:["응애 갓난아기","아기","어린이","청소년","청년","성인","할아버지"],
 missions:[{t:"Connect 메뉴 접속",xp:10,d:1},{t:"Contents 메뉴 접속",xp:10,d:1},{t:"출석",xp:10,d:1,done:1},{t:"콘텐츠 1차시 학습",xp:30,d:0},{t:"주간 목표 달성",xp:50,d:0}],
 badges:[["🌱","첫 방문"],["🔥","3일 연속 출석"],["📚","필수교육 완료"],["🎯","주간 목표"],["🏆","랭킹 1위"],["💎","학습 마스터"],["🤝","Connect 참여"],["⭐","30일 출석"]]};
const S={xp:0,pt:0,own:{},mb:530,rank:2,page:"home",tab:"mission",rank1:false,
 c:{skin:"#ffd9bd",hair:"#4a3020",style:"short",top:"#7ed957",acc:"none"},
 users:[["유*석",560],["이*지",530],["김*혁",390],["김*희",380],["이*원",370],["김*름",170],["김*",140],["최*규",130]],
 colors:["#ff8fa3","#5aa0ff","#7ed957","#ffc94d","#b07cff","#444"],hairs:["#4a3020","#1f1f1f","#c98b3c","#d9534f","#8a63d2","#f4d27a"],skins:["#ffe3cf","#ffd9bd","#e8b68f","#b9805a","#8a5a3c"]};
const lvl=()=>{let l=0;CFG.levels.forEach((v,i)=>{if(S.xp>=v)l=i});return l};
// ===== 캐릭터 SVG (7단계: 새싹아기→아기→어린이→청소년→청년→성인, 기존 캐릭터의 눈코입 스타일) =====
const st=()=>{const x=S.xp;return x<20?0:x<100?1:x<300?2:x<500?3:x<800?4:x<1200?5:6};
function baby(mood,c,jewel,face){
 const sk=c.skin,hk=c.hair,R=32;
 const eyes=mood=="alert"?`<path d="M30 67 l9 4 l-9 4 M70 67 l-9 4 l9 4" stroke="#3a1f15" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`
 :mood=="happy"?[38,62].map(x=>`<g class="eye"><circle cx="${x}" cy="70" r="8.6" fill="#6b3b28"/><circle cx="${x}" cy="70.5" r="5.4" fill="#2a140d"/><circle cx="${x+2.8}" cy="66.5" r="2.7" fill="#fff"/><circle cx="${x-2.6}" cy="73.4" r="1.3" fill="#fff"/></g>`).join("")
 :`<path d="M31 70 q7 6 14 0 M55 70 q7 6 14 0" stroke="#3a1f15" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
 const brow=mood=="alert"?"":`<path d="M31 59 q5-3 10 0 M59 59 q5-3 10 0" stroke="#b08070" stroke-width="1.5" fill="none" stroke-linecap="round"/>`;
 const mouth=mood=="alert"?`<ellipse cx="50" cy="85" rx="6.5" ry="5.5" fill="#b53e4a"/><ellipse cx="50" cy="88" rx="3.6" ry="2.2" fill="#ef7f86"/><path d="M29 77 q-3 5 0 8 q3-3 0-8z M71 77 q-3 5 0 8 q3-3 0-8z" fill="#8fd3ff"/>`
 :mood=="happy"?`<path d="M43 82 q7 9 14 0z" fill="#d65f5f" stroke="#a8403f" stroke-width="1.2" stroke-linejoin="round"/>`
 :`<ellipse cx="50" cy="84" rx="8" ry="5.4" fill="#8fd3ff" stroke="#5fb4ea"/><circle cx="50" cy="84" r="2.3" fill="#fff"/><circle cx="50" cy="91" r="3.2" fill="none" stroke="#5fb4ea" stroke-width="1.6"/>`;
 const hand=mood=="happy"?`<path class="wave" d="M70 102 Q79 96 79 84" stroke="${sk}" stroke-width="7" fill="none" stroke-linecap="round"/><circle cx="79" cy="82.5" r="4.6" fill="${sk}"/>`:mood=="alert"?"":`<circle cx="60" cy="99" r="4.6" fill="${sk}"/>`;
 const fists=mood=="alert"?`<circle cx="27" cy="90" r="4.8" fill="${sk}"/><circle cx="73" cy="90" r="4.8" fill="${sk}"/>`:"";
 const zz=mood=="happy"||mood=="alert"?"":`<text class="zz" x="76" y="38" font-size="11" fill="#7a9ad9" font-weight="700">z</text><text class="zz" x="83" y="28" font-size="8" fill="#7a9ad9" font-weight="700">z</text>`;
 let ac="",cape="";
 if(jewel){
  if(c.acc=="crown")ac=`<path d="M40 33 l-2-12 l7 5 l5-10 l5 10 l7-5 l-2 12z" fill="#ffd34d" stroke="#e0a800" stroke-width="1.2" stroke-linejoin="round"/><circle cx="50" cy="19" r="1.8" fill="#ff6b81"/>`;
  if(c.acc=="necklace")ac=`<path d="M40 97 q10 9 20 0" stroke="#ffd34d" stroke-width="2.2" fill="none"/><circle cx="50" cy="103" r="2.8" fill="#6fe0ff"/>`;
  if(c.acc=="earring")ac=`<circle cx="18" cy="75" r="2.8" fill="#ffd34d"/><circle cx="82" cy="75" r="2.8" fill="#ffd34d"/>`;
  if(c.acc=="cape")cape=`<path d="M28 94 l-8 26 h60 l-8-26z" fill="#e8484f"/>`}
 const vb=face?`${50-R*1.15} ${64-R*1.25} ${R*2.3} ${R*2.3}`:"8 16 84 106";
 return `<svg class="s0" viewBox="${vb}" xmlns="http://www.w3.org/2000/svg">${cape}
 <ellipse cx="50" cy="106" rx="26" ry="15" fill="${c.top}"/><path d="M26 104 Q50 118 76 102" stroke="#fff" stroke-opacity=".55" stroke-width="2" fill="none"/><path d="M30 111 Q52 122 72 110" stroke="#fff" stroke-opacity=".35" stroke-width="2" fill="none"/>${hand}
 <circle cx="18" cy="68" r="6.5" fill="${sk}" stroke="#0002"/><circle cx="18" cy="68" r="3" fill="#f6a89a" opacity=".7"/><circle cx="82" cy="68" r="6.5" fill="${sk}" stroke="#0002"/><circle cx="82" cy="68" r="3" fill="#f6a89a" opacity=".7"/>
 <circle cx="50" cy="64" r="32" fill="${sk}" stroke="#0002"/>
 <ellipse cx="27" cy="79" rx="7.5" ry="5" fill="#ff8a8a" opacity=".42"/><ellipse cx="73" cy="79" rx="7.5" ry="5" fill="#ff8a8a" opacity=".42"/>
 <path d="M21 56 C21 42 33 33.5 50 33.5 C67 33.5 79 42 79 56 Q64 47 50 49 Q36 47 21 56z" fill="${hk}" opacity=".4"/><path d="M50 33.5 q-4-8 4-9.5 q4 0 2.5 4" stroke="${hk}" stroke-width="2.4" fill="none" stroke-linecap="round"/>
 ${brow}${eyes}<ellipse cx="50" cy="77" rx="2.2" ry="1.7" fill="#f09a8a"/>${mouth}${fists}${zz}${ac}</svg>`}
const PAR=[0,[30,16,8,24],[26,24,14,26],[23,30,20,28],[21,36,26,30],[20,40,28,32],[20,38,26,32]];
function ch(mood,L=st(),c=S.c,jewel=(S.rank1||!!S.own[S.c.acc]),face=false){
 if(L==0)return baby(mood,c,jewel,face);
 const [R,bh,lh,bw]=PAR[L],fy=116,lt=fy-lh,bt=lt-bh+4,hy=bt-R*.78,old=L==6,hk=old?"#eef1f4":c.hair,sk=c.skin,k=R*.375,ey=hy+R*.15,ir=R*(L<3?.27:.24),ink="#3a1f15";
 const eye=(x,m)=>`<g class="eye"><circle cx="${x}" cy="${ey}" r="${ir*m}" fill="#6b3b28"/><circle cx="${x}" cy="${ey+.5}" r="${ir*m*.63}" fill="#2a140d"/><circle cx="${x+ir*.33*m}" cy="${ey-ir*.4*m}" r="${ir*.31*m}" fill="#fff"/><circle cx="${x-ir*.3*m}" cy="${ey+ir*.4*m}" r="${ir*.15*m}" fill="#fff"/><path d="M${x-ir*m} ${ey-ir*.4*m} q${ir*m} -${ir*1.05*m} ${ir*2*m} 0" stroke="${ink}" stroke-width="1.3" fill="none"/></g>`;
 const m=mood=="alert"?1.15:1,eyes=eye(50-k,m)+eye(50+k,m);
 const bc=old?"#cfd4d9":"#8a5a45",bwid=old?3:1.6,by=hy-R*(mood=="alert"?.38:.3);
 const brow=`<path d="M${50-k-R*.16} ${by} q${R*.16} -${R*.11} ${R*.32} 0 M${50+k-R*.16} ${by} q${R*.16} -${R*.11} ${R*.32} 0" stroke="${bc}" stroke-width="${bwid}" fill="none" stroke-linecap="round"/>`;
 const my=hy+R*(old?.66:.57),mouth=mood=="alert"?`<ellipse cx="50" cy="${my+R*.04}" rx="${R*.08}" ry="${R*.1}" fill="#b53e4a"/><path d="M${50+R*.7} ${hy-R*.1} q-${R*.1} ${R*.2} 0 ${R*.24} q${R*.1}-${R*.05} 0-${R*.24}z" fill="#8fd3ff"/>`
 :mood=="happy"?`<path d="M${50-R*.22} ${my-R*.04} q${R*.22} ${R*.3} ${R*.44} 0z" fill="#d65f5f" stroke="#a8403f" stroke-width="1.2" stroke-linejoin="round"/>`
 :`<path d="M${50-R*.14} ${my} q${R*.14} ${R*.17} ${R*.28} 0" stroke="#b5504a" stroke-width="2" fill="none" stroke-linecap="round"/>`;
 const nose=`<ellipse cx="50" cy="${hy+R*.4}" rx="${R*.07}" ry="${R*.055}" fill="#f09a8a"/>`;
 const blush=[-1,1].map(d=>`<ellipse cx="${50+d*R*.84}" cy="${hy+R*.47}" rx="${R*.23}" ry="${R*.16}" fill="#ff8a8a" opacity=".42"/>`).join("");
 const ears=[-1,1].map(d=>`<circle cx="${50+d*R*.97}" cy="${hy+R*.12}" r="${R*.2}" fill="${sk}" stroke="#0002"/><circle cx="${50+d*R*.97}" cy="${hy+R*.12}" r="${R*.09}" fill="#f6a89a" opacity=".7"/>`).join("");
 const sw=`M${50-R*1.03} ${hy-R*.06} C${50-R*1.1} ${hy-R*.75} ${50-R*.5} ${hy-R*1.12} 50 ${hy-R*1.12} C${50+R*.5} ${hy-R*1.12} ${50+R*1.1} ${hy-R*.75} ${50+R*1.03} ${hy-R*.06} Q${50+R*.5} ${hy-R*.56} ${50-R*.06} ${hy-R*.375} Q${50-R*.56} ${hy-R*.31} ${50-R*1.03} ${hy-R*.06}z`;
 let hb="",hf="",ex="";
 if(old){const t=d=>`<ellipse cx="${50+d*R*1.0}" cy="${hy-R*.02}" rx="${R*.22}" ry="${R*.42}" fill="${hk}" stroke="#0003"/>`;hb=t(-1)+t(1);
  hf=`<path d="M${50-R*.2} ${hy-R*.98} q${R*.2}-${R*.2} ${R*.4} 0" stroke="${hk}" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M${50-R*.4} ${hy-R*.55} q${R*.4}-${R*.14} ${R*.8} 0" stroke="#0002" fill="none"/>`;
  ex=`<ellipse cx="${50-R*.17}" cy="${hy+R*.52}" rx="${R*.2}" ry="${R*.1}" fill="#f4f6f8" stroke="#0003" transform="rotate(14 ${50-R*.17} ${hy+R*.52})"/><ellipse cx="${50+R*.17}" cy="${hy+R*.52}" rx="${R*.2}" ry="${R*.1}" fill="#f4f6f8" stroke="#0003" transform="rotate(-14 ${50+R*.17} ${hy+R*.52})"/><circle cx="${50-k}" cy="${ey}" r="${R*.3}" fill="none" stroke="#6b5b4b" stroke-width="1.6"/><circle cx="${50+k}" cy="${ey}" r="${R*.3}" fill="none" stroke="#6b5b4b" stroke-width="1.6"/><path d="M${50-k+R*.3} ${ey} h${2*k-R*.6}" stroke="#6b5b4b" stroke-width="1.6"/>`}
 else{hf=`<path d="${sw}" fill="${hk}" stroke="#0003" stroke-linejoin="round"/><path d="M${50-R*.8} ${hy-R*.7} q${R*.45}-${R*.3} ${R*.95}-${R*.18}" stroke="#fff" stroke-opacity=".3" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
  if(L>=2&&c.style=="bob")hb=`<ellipse cx="50" cy="${hy+R*.25}" rx="${R*1.12}" ry="${R*1.05}" fill="${hk}" stroke="#0003"/>`;
  if(L>=2&&c.style=="bun")hf+=`<circle cx="50" cy="${hy-R*1.12}" r="${R*.3}" fill="${hk}" stroke="#0003"/>`}
